[package]
# Shipped beside the compositor, in its Nix package, .deb and .rpm, never through
# crates.io.
publish = false
name = "desicompass-bar"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The bar of the desicompass session: the clock, the status icons, notifications and the tray"
repository.workspace = true

[lib]
name = "desicompass_bar"
path = "src/lib.rs"

[[bin]]
name = "desicompass-bar"
path = "src/main.rs"

[features]
# Compile SDL3 from source and link it statically. Only the release packages do
# (scripts/release-package.sh), because most distributions do not package SDL3
# yet. Off by default, so the dev shell and the Nix build link the system one.
bundled-sdl3 = ["sicompass-ui/bundled-sdl3"]

[target.'cfg(target_os = "linux")'.dependencies]
desicompass-bar-protocol = { path = "../lib_bar_protocol" }

# The renderer, for its window, fonts and colours, exactly as the superkey
# links it. Keep both at the same pin, and `sicompass-sdk` at the version
# sicompass-ui requires, or cargo builds two copies. For local work, uncomment
# the `[patch]` sections at the bottom of the workspace's root Cargo.toml.
sicompass-sdk = "0.9.16"
sicompass-ui = { git = "https://github.com/friendlyflow/sicompass-ui", tag = "v0.2.4" }

# NetworkManager, UPower and BlueZ on the system bus; the notification server
# and the tray on the session bus. Already in the lock through accesskit_unix
# (and the compositor links it directly), so this adds no crates.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
# Icons are drawn here and handed to the renderer as PNG. Already in the lock
# through sicompass-ui.
image = { version = "0.25", default-features = false, features = ["png"] }
# SDL's key and window events, which the bar's own loop reads. sicompass-ui
# links it already.
sdl3 = "0.18"
ash = "0.38"

clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
