[package]
# Shipped as a Nix package beside the compositor, never through crates.io.
publish = false
name = "desicompass-superkey"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The superkey of the desicompass session: windows, controls, settings and programs"
repository.workspace = true

[lib]
name = "desicompass_superkey"
path = "src/lib.rs"

[[bin]]
name = "desicompass-superkey"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
desicompass-superkey-protocol = { path = "../lib_superkey_protocol" }
# The bar's settings (Settings > Bar) and its status (the Status section).
# Serde only: the superkey never links the bar.
desicompass-bar-protocol = { path = "../lib_bar_protocol" }
# Dismissing a notification and activating a tray item, on the session bus.
# Already in the lock through accesskit_unix, so this adds no crates.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

# The renderer and its element model, exactly as loginsicompass links them:
# the superkey is a list, searched and read out the way the app's lists are.
# Not the `sicompass` application crate, which would drag wasmtime, SQLite and
# a headless Chromium into a superkey.
#
# Keep `sicompass-sdk` at the version sicompass-ui requires, or cargo builds
# two copies. sicompass-ui is not on crates.io: pinned by git, to a `rev`
# between releases and a `tag` at a release. For local work, uncomment the
# `[patch]` sections at the bottom of the workspace's root Cargo.toml.
sicompass-sdk = "0.9.0"
sicompass-ui = { git = "https://github.com/friendlyflow/sicompass-ui", rev = "45f6a676b208db6bf2f70520d64f21f815f0fabc" }
# The Tutorial section: sicompass's own tutorial provider, which the app
# leaves out in a session. Light (the SDK and serde_json), never published, so
# pinned by git like sicompass-ui.
sicompass-tutorial = { git = "https://github.com/friendlyflow/sicompass", rev = "5853e193446a065739e124d9ddf20298d1e0d32c" }

serde = "1"
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
# Only for the `Keycode`/`Mod` types the key dispatcher takes, in
# tests/superkey_ui.rs. sicompass-ui links sdl3 already.
sdl3 = "0.18"
