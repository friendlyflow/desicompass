# The compositor is the root package, and its superkey lives beside it in
# lib/. `cargo test` and `cargo clippy` cover all of them (default-members).
[workspace]
members = [".", "lib/lib_bar", "lib/lib_bar_protocol", "lib/lib_superkey", "lib/lib_superkey_protocol"]
default-members = [".", "lib/lib_bar", "lib/lib_bar_protocol", "lib/lib_superkey", "lib/lib_superkey_protocol"]
resolver = "3"

# The one version for everything built here. flake.nix reads it from this
# table.
[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/friendlyflow/desicompass"

[package]
# Shipped as a Nix package and through the NixOS module in flake.nix, never
# through crates.io.
publish = false
name = "desicompass"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Keyboard-driven tiling Wayland compositor for sicompass"
# The superkey and the bar are binaries in the workspace too, so a bare
# `cargo run` needs to be told which one is the compositor.
default-run = "desicompass"
repository.workspace = true

[[bin]]
name = "desicompass"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
# Smithay: Wayland compositor framework.
# backend_winit  — run inside an existing X11/Wayland session (development).
# backend_egl    — EGL context used by the winit + gles backend.
# renderer_gl    — GlesRenderer for rendering to the winit window.
# use_system_lib — link against system wayland/xkb C libraries.
# desktop        — Space + Window layout helpers.
# wayland_frontend — server-side Wayland protocol implementations.
# backend_drm    — `DrmNode`, for the TTY backend and for advertising
#                  zwp_linux_dmabuf_v1, which means telling clients which
#                  device to allocate on (`EGLDevice::try_get_render_node` is
#                  gated on this feature).
# backend_gbm, backend_libinput, backend_udev, backend_session_libseat,
# renderer_multi — the TTY backend: take the display through DRM/KMS and
#                  libseat, and read input through libinput. Always built, so
#                  a plain `cargo build` can run a real session. libinput,
#                  libseat, libudev and gbm come from the dev shell.
#
# Pinned to a git commit rather than a crates.io release: 0.7.0 (June 2025)
# is the last release, and master is far ahead of it (Dispatch2 delegates,
# the DnD rework, InputTime). master still calls itself 0.7.0, so the rev is
# the only thing that identifies it. The Nix build (crane) fetches it by the
# rev in Cargo.lock, so bumping it needs no hash in flake.nix.
smithay = { git = "https://github.com/Smithay/smithay", rev = "79bbed5e1199090d787115614847a79c76607181", default-features = false, features = [
    "desktop",
    "wayland_frontend",
    "backend_winit",
    "backend_egl",
    "renderer_gl",
    "use_system_lib",
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
    "renderer_multi",
] }

# Logging
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Command-line argument parsing
clap = { version = "4", features = ["derive"] }

# Reads the keyboard layout from systemd-localed (org.freedesktop.locale1)
# on the system bus, which is where the OS installer puts it. Already in the
# lock through accesskit_unix, so this adds no crates.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

# The superkey protocol, shared with desicompass-superkey. Serde only: the
# compositor must never link the superkey itself (SDL3, Vulkan).
desicompass-superkey-protocol = { path = "lib/lib_superkey_protocol" }
# The bar's protocol, for the same reason: serde only, never the bar itself
# (SDL3, Vulkan).
desicompass-bar-protocol = { path = "lib/lib_bar_protocol" }
serde = "1"
serde_json = "1"
# FD_CLOEXEC on the sockets handed to the superkey. Already in the lock
# through smithay and calloop.
libc = "0.2"

# Work on the renderer and the superkey together: uncomment, and comment out
# again before committing (the same rule as in sicompass and loginsicompass).
# It has to be here, in the workspace root, to apply to lib/lib_superkey.
# [patch."https://github.com/friendlyflow/sicompass-ui"]
# sicompass-ui = { path = "../sicompass-ui" }
# [patch."https://github.com/friendlyflow/sicompass"]
# sicompass-tutorial = { path = "../sicompass/lib/lib_tutorial" }
# sicompass-store = { path = "../sicompass/lib/lib_store" }
# [patch.crates-io]
# sicompass-sdk = { path = "../sicompass-plugin-sdk" }

# TEMPORARY, until sicompass-sdk 0.9.6 is on crates.io: the SDK commit with
# plugin protocol 1.2, which sicompass-ui and the Store need. By git rev so
# `nix build` can fetch it. Remove at the release, together with the matching
# patch in sicompass.
[patch.crates-io]
sicompass-sdk = { git = "https://github.com/friendlyflow/sicompass-plugin-sdk", rev = "27cdf66e5c2c42321417ec6a00c790ff70bbd821" }
