# The compositor is the root package, and its superkey lives beside it in
# lib/. `cargo test` and `cargo clippy` cover all of them (default-members).
[workspace]
members = [".", "lib/lib_bar", "lib/lib_bar_protocol", "lib/lib_superkey", "lib/lib_superkey_protocol"]
default-members = [".", "lib/lib_bar", "lib/lib_bar_protocol", "lib/lib_superkey", "lib/lib_superkey_protocol"]
resolver = "3"

# The one version for everything built here. flake.nix reads it from this
# table.
[workspace.package]
version = "0.2.2"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/friendlyflow/desicompass"

[package]
# Shipped as a Nix package, through the NixOS module in flake.nix, and as a .deb
# and an .rpm (see below), never through crates.io.
publish = false
name = "desicompass"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Keyboard-driven tiling Wayland compositor for sicompass"
# The superkey and the bar are binaries in the workspace too, so a bare
# `cargo run` needs to be told which one is the compositor.
default-run = "desicompass"
repository.workspace = true

[[bin]]
name = "desicompass"
path = "src/main.rs"

# ---------------------------------------------------------------------------
# Linux packages, built by scripts/release-package.sh. See docs/releasing.md.
# ---------------------------------------------------------------------------
#
# Two lists of the same files, because cargo-deb and cargo-generate-rpm each
# want their own. tests/packaging.rs fails when they disagree. Fonts are inside
# the binaries through sicompass-ui, so their licenses ship with them, and the
# glob picks up a font the renderer adds.
#
# Several libraries are dlopened, so they show up as no ELF dependency, no scan
# finds them, and each has to be declared here. The compositor dlopens libEGL,
# libGLESv2 and libwayland-server by bare name. The superkey and the bar dlopen the
# Vulkan loader, and SDL3 dlopens libwayland-client, -egl and -cursor. Missing one,
# the compositor exits with `NoWaylandLib` on a computer that lacks it, which no
# desktop does, so scripts/check-install.sh runs them in a bare container.
# Everything else the binaries link is found by `$auto` (dpkg-shlibdeps) and by
# packaging/rpm-find-requires.
#
# at-spi2-core is what accesskit_unix talks to over D-Bus. Without it the session
# runs and is silent to screen readers, which here is a complete failure. The
# session script runs systemd-cat and dbus-run-session (see its comments).
#
# The sicompass floor is the release the superkey's Store checks plugins against
# (the `tag` of sicompass-store in lib/lib_superkey/Cargo.toml). tests/packaging.rs
# fails if it does not move with that pin.
#
# Orca, foot (Super+Return's terminal), speech-dispatcher (Super+D) and
# wireplumber (the volume) are recommended only: the session works without each.
[package.metadata.deb]
name = "desicompass"
maintainer = "Nico Verrijdt <nico@friendlyflow.com>"
copyright = "Nico Verrijdt <nico@friendlyflow.com>"
section = "x11"
priority = "optional"
# Upstream's own package, so there is no Debian revision to add to the version.
revision = ""
depends = "$auto, sicompass (>= 0.2.3), systemd, dbus, at-spi2-core, libegl1, libgles2, libwayland-server0, libwayland-client0, libwayland-egl1, libwayland-cursor0, libvulkan1, mesa-vulkan-drivers | vulkan-icd"
recommends = "orca, foot, speech-dispatcher, wireplumber"
maintainer-scripts = "packaging/scripts/"
assets = [
    ["target/release/desicompass", "usr/bin/desicompass", "755"],
    ["target/release/desicompass-superkey", "usr/bin/desicompass-superkey", "755"],
    ["target/release/desicompass-bar", "usr/bin/desicompass-bar", "755"],
    ["packaging/desicompass-session", "usr/bin/desicompass-session", "755"],
    ["packaging/desicompass.desktop", "usr/share/wayland-sessions/desicompass.desktop", "644"],
    ["packaging/desicompass.sysusers", "usr/lib/sysusers.d/desicompass.conf", "644"],
    ["packaging/desicompass.tmpfiles", "usr/lib/tmpfiles.d/desicompass.conf", "644"],
    ["README.md", "usr/share/doc/desicompass/README.md", "644"],
    ["LICENSE", "usr/share/doc/desicompass/LICENSE", "644"],
    ["THIRD-PARTY-LICENSES.html", "usr/share/doc/desicompass/THIRD-PARTY-LICENSES.html", "644"],
    ["lib/lib_superkey/fonts/LICENSE-*.txt", "usr/share/doc/desicompass/", "644"],
]

# Run from the repo root: `source` is relative to the working directory. Sonames
# and file paths rather than package names where the name is not the same on
# Fedora and openSUSE.
[package.metadata.generate-rpm]
summary = "Keyboard-driven tiling Wayland compositor for sicompass"
license = "GPL-3.0-only"
url = "https://github.com/friendlyflow/desicompass"
post_install_script = "packaging/scripts/postinst"
requires = { sicompass = ">= 0.2.3", systemd = "*", "/usr/bin/dbus-run-session" = "*", at-spi2-core = "*", "libEGL.so.1()(64bit)" = "*", "libGLESv2.so.2()(64bit)" = "*", "libwayland-server.so.0()(64bit)" = "*", "libwayland-client.so.0()(64bit)" = "*", "libwayland-egl.so.1()(64bit)" = "*", "libwayland-cursor.so.0()(64bit)" = "*", "libvulkan.so.1()(64bit)" = "*" }
recommends = { mesa-vulkan-drivers = "*", orca = "*", foot = "*", speech-dispatcher = "*", wireplumber = "*" }
assets = [
    { source = "target/release/desicompass", dest = "/usr/bin/desicompass", mode = "755" },
    { source = "target/release/desicompass-superkey", dest = "/usr/bin/desicompass-superkey", mode = "755" },
    { source = "target/release/desicompass-bar", dest = "/usr/bin/desicompass-bar", mode = "755" },
    { source = "packaging/desicompass-session", dest = "/usr/bin/desicompass-session", mode = "755" },
    { source = "packaging/desicompass.desktop", dest = "/usr/share/wayland-sessions/desicompass.desktop", mode = "644" },
    { source = "packaging/desicompass.sysusers", dest = "/usr/lib/sysusers.d/desicompass.conf", mode = "644" },
    { source = "packaging/desicompass.tmpfiles", dest = "/usr/lib/tmpfiles.d/desicompass.conf", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/desicompass/README.md", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/doc/desicompass/LICENSE", mode = "644" },
    { source = "THIRD-PARTY-LICENSES.html", dest = "/usr/share/doc/desicompass/THIRD-PARTY-LICENSES.html", mode = "644" },
    { source = "lib/lib_superkey/fonts/LICENSE-*.txt", dest = "/usr/share/doc/desicompass/", mode = "644" },
]

[target.'cfg(target_os = "linux")'.dependencies]
# Smithay: Wayland compositor framework.
# backend_winit  — run inside an existing X11/Wayland session (development).
# backend_egl    — EGL context used by the winit + gles backend.
# renderer_gl    — GlesRenderer for rendering to the winit window.
# use_system_lib — link against system wayland/xkb C libraries.
# desktop        — Space + Window layout helpers.
# wayland_frontend — server-side Wayland protocol implementations.
# backend_drm    — `DrmNode`, for the TTY backend and for advertising
#                  zwp_linux_dmabuf_v1, which means telling clients which
#                  device to allocate on (`EGLDevice::try_get_render_node` is
#                  gated on this feature).
# backend_gbm, backend_libinput, backend_udev, backend_session_libseat,
# renderer_multi — the TTY backend: take the display through DRM/KMS and
#                  libseat, and read input through libinput. Always built, so
#                  a plain `cargo build` can run a real session. libinput,
#                  libseat, libudev and gbm come from the dev shell.
#
# Pinned to a git commit rather than a crates.io release: 0.7.0 (June 2025)
# is the last release, and master is far ahead of it (Dispatch2 delegates,
# the DnD rework, InputTime). master still calls itself 0.7.0, so the rev is
# the only thing that identifies it. The Nix build (crane) fetches it by the
# rev in Cargo.lock, so bumping it needs no hash in flake.nix.
smithay = { git = "https://github.com/Smithay/smithay", rev = "79bbed5e1199090d787115614847a79c76607181", default-features = false, features = [
    "desktop",
    "wayland_frontend",
    "backend_winit",
    "backend_egl",
    "renderer_gl",
    "use_system_lib",
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
    "renderer_multi",
] }

# Logging
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Command-line argument parsing
clap = { version = "4", features = ["derive"] }

# Reads the keyboard layout from systemd-localed (org.freedesktop.locale1)
# on the system bus, which is where the OS installer puts it. Already in the
# lock through accesskit_unix, so this adds no crates.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

# The superkey protocol, shared with desicompass-superkey. Serde only: the
# compositor must never link the superkey itself (SDL3, Vulkan).
desicompass-superkey-protocol = { path = "lib/lib_superkey_protocol" }
# The bar's protocol, for the same reason: serde only, never the bar itself
# (SDL3, Vulkan).
desicompass-bar-protocol = { path = "lib/lib_bar_protocol" }
serde = "1"
serde_json = "1"
# FD_CLOEXEC on the sockets handed to the superkey. Already in the lock
# through smithay and calloop.
libc = "0.2"

# Work on the renderer and the superkey together: uncomment, and comment out
# again before committing (the same rule as in sicompass and loginsicompass).
# It has to be here, in the workspace root, to apply to lib/lib_superkey.
# [patch."https://github.com/friendlyflow/sicompass-ui"]
# sicompass-ui = { path = "../sicompass-ui" }
# [patch."https://github.com/friendlyflow/sicompass"]
# sicompass-tutorial = { path = "../sicompass/lib/lib_tutorial" }
# sicompass-store = { path = "../sicompass/lib/lib_store" }
# [patch.crates-io]
# sicompass-sdk = { path = "../sicompass-plugin-sdk" }

